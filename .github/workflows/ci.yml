name: Zensical

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build both languages
        run: python scripts/build.py

      - name: Check site configuration, assets and language switcher
        run: python -m unittest discover -s tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/a11y/package-lock.json

      - name: Install accessibility check
        run: npm ci --prefix tests/a11y

      - name: Check accessibility (axe-core, WCAG 2.2 A/AA)
        # Uses the Chrome preinstalled on GitHub's Ubuntu runners.
        run: node tests/a11y/axe.mjs
