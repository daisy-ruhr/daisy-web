<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAISY</title>
  <style>
    /* Touch targets of at least 24px (WCAG 2.5.8) */
    li { margin: 0.5rem 0; }
    li a { display: inline-block; padding: 0.25rem 0; }
  </style>
  <script>
    const languages = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language];
    const preferred = languages.find(language => /^(de|en)(-|$)/i.test(language || ""));
    const language = preferred && /^de(-|$)/i.test(preferred) ? "de" : "en";
    location.replace(language + "/" + location.search + location.hash);
  </script>
</head>
<body>
  <main>
    <h1>DAISY</h1>
    <p>Select your language / <span lang="de">Sprache auswählen</span>:</p>
    <ul>
      <li><a href="de/" hreflang="de" lang="de">Deutsch</a></li>
      <li><a href="en/" hreflang="en">English</a></li>
    </ul>
  </main>
</body>
</html>
