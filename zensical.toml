[project]
site_name = "Projekt DAISY"
site_description = "Datenschutz und Arbeitnehmendeninteressen in AI-as-a-Service-Systemen"
site_author = "DAISY Team"
site_url = "https://daisy.ruhr/de/"
docs_dir = "docs/de"
site_dir = "site/de"
extra_css = ["assets/styles/extra.css"]
watch = ["assets"]
nav = [
  { "Start" = "index.md" },
  { "Das Projekt" = "project.md" },
  { "Wissenschaftlicher Ansatz" = "approach.md" },
  { "Arbeitspakete" = "work-packages.md" },
  { "Ergebnisse & Transfer" = "results.md" },
  { "Rechtlicher Rahmen" = "legal-framework.md" },
  { "Konsortium & Netzwerk" = "network.md" },
  { "Kontakt" = "contact.md" },
  { "Glossar" = "glossary.md" },
  { "Über DAISY" = [
    { "Impressum" = "Impressum.md" },
    { "Datenschutz" = "Datenschutz.md" },
  ] },
]

[project.extra]
generator = false
alternate = [
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "English", link = "/en/", lang = "en" },
]

[project.extra.localization.en]
site_name = "DAISY Project"
site_description = "Data Protection and Employee Interests in AI-as-a-Service Systems"
docs_dir = "docs/en"
site_dir = "site/en"
nav = [
  { "Home" = "index.md" },
  { "The Project" = "project.md" },
  { "Scientific Approach" = "approach.md" },
  { "Work Packages" = "work-packages.md" },
  { "Results & Transfer" = "results.md" },
  { "Legal Framework" = "legal-framework.md" },
  { "Consortium & Network" = "network.md" },
  { "Contact" = "contact.md" },
  { "Glossary" = "glossary.md" },
  { "About DAISY" = [
    { "Legal Notice" = "Impressum.md" },
    { "Privacy Policy" = "Datenschutz.md" },
  ] },
]
palette_toggle_names = { slate = "Switch to light mode", default = "Switch to dark mode" }

[project.plugins.search]
enabled = true

[project.theme]
language = "de"
variant = "classic"
font = false
favicon = "assets/img/favicon.svg"
custom_dir = "overrides"
features = [
  "navigation.tracking",
  "navigation.top",
  "navigation.sections",
  "navigation.footer",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Zu hellem Modus wechseln"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Zu dunklem Modus wechseln"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.blocks.caption = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
