[project]
site_name = "DAISY"
site_description = "Data Protection and Employee Interests in AI-as-a-Service Systems"
site_author = "DAISY Team"
site_url = "https://daisy.ruhr/en/"
docs_dir = "docs/en"
site_dir = "site/en"
extra_css = ["assets/styles/extra.css"]
extra_javascript = ["assets/javascripts/news.js"]
watch = ["overrides/assets", "docs/shared"]
nav = [
  { "Project" = "index.md" },
  { "News" = "news/index.md" },
  { "Results" = "publications.md" },
  { "Team" = "team.md" },
]

draft_docs = """
*.draft.md
"""

[project.extra]
generator = false
alternate = [
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "English", link = "/en/", lang = "en" },
]

[project.plugins.search]
enabled = true

[project.plugins.blog]
blog_dir = "news"
post_url_format = "{slug}"
post_readtime = false
archive = false
categories = false
authors = false
pagination = false

[project.theme]
language = "en"
variant = "classic"
font = false
favicon = "assets/img/favicon.svg"
logo = "assets/img/logo_w_shadow.svg"
custom_dir = "overrides"
features = [
  "navigation.tracking",
  "navigation.top",
  "navigation.sections",
  "navigation.footer",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.betterem = {}
pymdownx.blocks.caption = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
